<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HU Graph - Neural View</title>
<script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap');

:root {
  --bg: #000000;
  --surface: rgba(28,28,30,0.72);
  --surface-border: rgba(255,255,255,0.06);
  --surface-glow: rgba(255,255,255,0.02);
  --text-primary: rgba(255,255,255,0.92);
  --text-secondary: rgba(255,255,255,0.55);
  --text-tertiary: rgba(255,255,255,0.35);
  --accent-blue: #0a84ff;
  --accent-purple: #bf5af2;
  --accent-orange: #ff9f0a;
  --accent-green: #30d158;
  --accent-red: #ff453a;
  --accent-teal: #64d2ff;
  --radius: 16px;
  --blur: blur(40px) saturate(1.8);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", sans-serif;
  height: 100vh; display: flex;
  background: var(--bg); color: var(--text-primary);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Neural ambient mesh */
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 800px 600px at 20% 30%, rgba(10,132,255,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 600px 800px at 80% 70%, rgba(191,90,242,0.05) 0%, transparent 70%),
    radial-gradient(ellipse 900px 400px at 50% 90%, rgba(48,209,88,0.03) 0%, transparent 60%);
  pointer-events: none; z-index: 0;
  animation: meshShift 20s ease-in-out infinite alternate;
}
@keyframes meshShift {
  0% { opacity: 0.7; transform: scale(1); }
  100% { opacity: 1; transform: scale(1.05); }
}

#cy {
  flex: 1; z-index: 1;
  position: relative;
  background: transparent;
}

/* Apple glass surface */
.glass-panel {
  background: var(--surface);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius);
  box-shadow:
    0 0 0 0.5px rgba(255,255,255,0.05) inset,
    0 20px 60px -10px rgba(0,0,0,0.5),
    0 2px 8px rgba(0,0,0,0.2);
}

/* === PANEL LATERAL === */
#panel {
  width: 380px; z-index: 10;
  background: rgba(28,28,30,0.88);
  backdrop-filter: blur(60px) saturate(2);
  -webkit-backdrop-filter: blur(60px) saturate(2);
  border-left: 1px solid var(--surface-border);
  overflow-y: auto; padding: 0;
  display: none; flex-direction: column; gap: 0;
  transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1);
  transform: translateX(100%); opacity: 0;
}
#panel.active {
  display: flex;
  transform: translateX(0); opacity: 1;
}
#panel-header {
  padding: 16px 24px 12px;
  border-bottom: 1px solid var(--surface-border);
  display: flex; align-items: center; justify-content: space-between;
}
#panel-header .logo {
  font-size: 11px; font-weight: 500; color: var(--text-tertiary);
  letter-spacing: 0.3px; text-transform: uppercase;
}
#panel-header .close-btn {
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
  color: var(--text-tertiary); width: 24px; height: 24px;
  border-radius: 6px; cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s ease;
}
#panel-header .close-btn:hover {
  background: rgba(255,255,255,0.1); color: var(--text-primary);
}
#panel-body {
  padding: 20px 24px 28px;
  display: flex; flex-direction: column; gap: 20px;
  overflow-y: auto; flex: 1;
}
#panel h2 {
  font-size: 17px; font-weight: 600; color: var(--text-primary);
  letter-spacing: -0.3px; line-height: 1.4; margin: 0;
}
#panel h3 {
  font-size: 11px; font-weight: 500; color: var(--text-tertiary);
  text-transform: uppercase; letter-spacing: 0.8px; margin: 0 0 8px 0;
}
#panel p { font-size: 14px; line-height: 1.7; color: var(--text-secondary); font-weight: 300; margin: 0; }
#panel ul { padding-left: 16px; font-size: 13px; color: var(--text-secondary); font-weight: 300; margin: 0; }
#panel li { margin: 6px 0; line-height: 1.5; }
.panel-section {
  padding-bottom: 16px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.panel-section:last-child { border-bottom: none; padding-bottom: 0; }
.narrative-block {
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.05);
  border-radius: 10px; padding: 14px 16px;
  font-size: 13px; line-height: 1.7; color: var(--text-secondary);
}
.narrative-block strong {
  color: var(--text-primary); font-weight: 500; font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.4px;
  display: block; margin-bottom: 2px; margin-top: 10px;
}
.narrative-block strong:first-child { margin-top: 0; }
.acceptance-criteria {
  list-style: none; padding: 0; margin: 0;
}
.acceptance-criteria li {
  background: rgba(48,209,88,0.04);
  border: 1px solid rgba(48,209,88,0.1);
  border-radius: 8px; padding: 10px 14px;
  margin: 6px 0; font-size: 12px; line-height: 1.6;
}
.acceptance-criteria .ac-label {
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.5px; margin-right: 6px;
}
.ac-given { color: var(--accent-teal); }
.ac-when { color: var(--accent-orange); }
.ac-then { color: var(--accent-green); }
.stats-row {
  display: flex; gap: 12px; flex-wrap: wrap;
}
.stat-pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 12px; border-radius: 20px;
  font-size: 11px; font-weight: 500;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  color: var(--text-secondary);
}
.stat-pill .stat-num { color: var(--text-primary); font-weight: 600; }

/* Tags */
.tag {
  display: inline-flex; align-items: center;
  padding: 4px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 500; margin: 3px 4px 3px 0;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.tag:hover { transform: scale(1.05); }
.tag-entity { background: rgba(10,132,255,0.12); color: var(--accent-blue); border: 1px solid rgba(10,132,255,0.2); }
.tag-flow { background: rgba(191,90,242,0.12); color: var(--accent-purple); border: 1px solid rgba(191,90,242,0.2); }
.tag-complexity { background: rgba(255,159,10,0.12); color: var(--accent-orange); border: 1px solid rgba(255,159,10,0.2); }
.tag-expert { background: rgba(48,209,88,0.12); color: var(--accent-green); border: 1px solid rgba(48,209,88,0.2); }

.status-badge {
  display: inline-flex; align-items: center;
  padding: 5px 14px; border-radius: 20px;
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
}
.status-analyzed { background: rgba(255,159,10,0.12); color: var(--accent-orange); border: 1px solid rgba(255,159,10,0.2); }
.status-refined { background: rgba(10,132,255,0.12); color: var(--accent-blue); border: 1px solid rgba(10,132,255,0.2); }
.status-completed { background: rgba(48,209,88,0.12); color: var(--accent-green); border: 1px solid rgba(48,209,88,0.2); }

/* === TOOLBAR === */
#toolbar {
  position: absolute; top: 20px; left: 20px; z-index: 20;
  display: flex; gap: 6px; align-items: center;
  padding: 6px 8px; border-radius: 14px;
  background: rgba(28,28,30,0.72);
  backdrop-filter: blur(40px) saturate(1.8);
  -webkit-backdrop-filter: blur(40px) saturate(1.8);
  border: 1px solid var(--surface-border);
  box-shadow: 0 8px 40px rgba(0,0,0,0.4);
}
#toolbar button {
  background: transparent; border: 1px solid transparent;
  color: var(--text-secondary); padding: 7px 14px; border-radius: 10px;
  cursor: pointer; font-size: 12px; font-weight: 500;
  transition: all 0.25s cubic-bezier(0.32,0.72,0,1);
  letter-spacing: -0.1px;
}
#toolbar button:hover {
  background: rgba(255,255,255,0.06); color: var(--text-primary);
}
#toolbar button.active {
  background: rgba(10,132,255,0.15); color: var(--accent-blue);
  border-color: rgba(10,132,255,0.3);
  box-shadow: 0 0 20px rgba(10,132,255,0.1);
}
#toolbar select {
  background: rgba(255,255,255,0.04); color: var(--text-secondary);
  border: 1px solid rgba(255,255,255,0.08);
  padding: 7px 10px; border-radius: 10px; font-size: 12px;
  font-family: inherit; cursor: pointer;
  transition: all 0.2s ease;
  max-width: 160px;
}
#toolbar select:hover {
  background: rgba(255,255,255,0.07);
  border-color: rgba(255,255,255,0.14);
}
#toolbar select:focus {
  outline: none;
  border-color: rgba(10,132,255,0.4);
  box-shadow: 0 0 8px rgba(10,132,255,0.15);
}
#toolbar select option {
  background: #1c1c1e; color: var(--text-primary);
}
#toolbar select.selector-active {
  color: var(--accent-blue);
  border-color: rgba(10,132,255,0.3);
  background: rgba(10,132,255,0.08);
}

/* === TOOLTIP === */
#tooltip {
  position: fixed; z-index: 9999;
  padding: 12px 16px; border-radius: 14px;
  background: rgba(44,44,46,0.92);
  backdrop-filter: blur(30px) saturate(1.6);
  -webkit-backdrop-filter: blur(30px) saturate(1.6);
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  pointer-events: none;
  opacity: 0; transition: opacity 0.3s cubic-bezier(0.25,1,0.5,1), transform 0.3s cubic-bezier(0.25,1,0.5,1), filter 0.3s ease;
  transform: scale(0.94);
  filter: blur(2px);
  max-width: 300px;
}
#tooltip.visible { opacity: 1; transform: scale(1); filter: blur(0); }
#tooltip .tt-id { font-size: 11px; color: var(--text-tertiary); font-weight: 500; letter-spacing: 0.5px; }
#tooltip .tt-title { font-size: 14px; color: var(--text-primary); font-weight: 500; margin-top: 4px; letter-spacing: -0.2px; }
#tooltip .tt-desc { font-size: 12px; color: var(--text-secondary); margin-top: 6px; line-height: 1.5; font-weight: 300; }
#tooltip .tt-meta { font-size: 11px; color: var(--text-tertiary); margin-top: 8px; display: flex; gap: 12px; flex-wrap: wrap; }

/* === LEGEND === */
#legend {
  position: absolute; bottom: 20px; left: 20px; z-index: 20;
  padding: 16px 20px; border-radius: 14px; font-size: 11px;
  background: rgba(28,28,30,0.72);
  backdrop-filter: blur(40px) saturate(1.8);
  -webkit-backdrop-filter: blur(40px) saturate(1.8);
  border: 1px solid var(--surface-border);
  box-shadow: 0 8px 40px rgba(0,0,0,0.4);
}
#legend .row { display: flex; align-items: center; gap: 10px; margin: 6px 0; color: var(--text-secondary); font-weight: 400; }
#legend .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 6px currentColor; }
#legend .dot-diamond { width: 7px; height: 7px; transform: rotate(45deg); flex-shrink: 0; border-radius: 1px; }
#legend .line { width: 16px; height: 2px; flex-shrink: 0; border-radius: 1px; }

/* Neural pulse animation for nodes */
@keyframes neuralPulse {
  0%, 100% { box-shadow: 0 0 8px rgba(10,132,255,0.3); }
  50% { box-shadow: 0 0 20px rgba(10,132,255,0.6); }
}

/* Scrollbar Apple-style */
#panel-body::-webkit-scrollbar { width: 4px; }
#panel-body::-webkit-scrollbar-track { background: transparent; }
#panel-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
#panel-body::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

/* Content transition */
#panel-content {
  transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1), filter 0.4s cubic-bezier(0.25, 1, 0.5, 1);
}
#panel-content.transitioning {
  opacity: 0;
  filter: blur(4px);
}
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Toggle switch Apple style */
.toggle-group {
  display: flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px; padding: 3px;
}
.toggle-group button {
  background: transparent !important; border: none !important;
  color: var(--text-tertiary) !important; padding: 6px 14px !important;
  border-radius: 8px !important; font-size: 11px !important;
  transition: all 0.3s cubic-bezier(0.25,1,0.5,1) !important;
}
.toggle-group button.active {
  background: rgba(10,132,255,0.18) !important;
  color: var(--accent-blue) !important;
  box-shadow: 0 0 12px rgba(10,132,255,0.1) !important;
}
.toolbar-label {
  font-size: 10px; color: var(--text-tertiary);
  text-transform: uppercase; letter-spacing: 0.6px; font-weight: 500;
  margin-right: 2px;
}
.toolbar-divider {
  width: 1px; height: 24px; background: rgba(255,255,255,0.06); margin: 0 6px;
}
.icon-btn { display: inline-flex; align-items: center; gap: 5px; }
.icon-btn svg { width: 13px; height: 13px; opacity: 0.7; }
</style>
</head>
<body>
<nav class="view-selector" style="position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;gap:0;background:rgba(18,18,20,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--surface-border);padding:0 24px;height:36px">
  <a href="/" style="padding:6px 18px;text-decoration:none;font-size:10px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:var(--accent-blue);border-bottom:2px solid var(--accent-blue)">Red Neuronal</a>
  <a href="/ecosystem" style="padding:6px 18px;text-decoration:none;font-size:10px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:var(--text-secondary);border-bottom:2px solid transparent">Ecosistema</a>
</nav>
<div id="toolbar" class="glass-panel" style="top:44px">
  <span class="toolbar-label">Workspace</span>
  <select id="selectorWorkspace" onchange="switchWorkspace(this.value)">
    <option value="">Cargando...</option>
  </select>
  <span class="toolbar-divider"></span>
  <span class="toolbar-label">Ecosistema</span>
  <select id="selectorEcosystem" onchange="switchEcosystem(this.value)">
    <option value="">Cargando...</option>
  </select>
  <span class="toolbar-divider"></span>
  <span class="toolbar-label">Vista</span>
  <div class="toggle-group">
    <button onclick="setLayout('dagre')" id="btn-dagre" class="active">Jerarquico</button>
    <button onclick="setLayout('concentric')" id="btn-concentric">Concentrico</button>
  </div>
  <span class="toolbar-divider"></span>
  <span class="toolbar-label">Capas</span>
  <button onclick="toggleEntities()" id="btn-entities" class="active icon-btn">
    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1L1 5l7 4 7-4-7-4zM1 8l7 4 7-4M1 11l7 4 7-4" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
    Entidades
  </button>
  <button onclick="toggleFlows()" id="btn-flows" class="icon-btn">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 8h3M11 8h3M5 8a3 3 0 1 1 6 0 3 3 0 0 1-6 0z"/><path d="M1 4v8M15 4v8" stroke-width="1.5" stroke-linecap="round"/></svg>
    Flujos
  </button>
  <button onclick="toggleRelations()" id="btn-relations" class="active icon-btn">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 4l6 4 6-4M2 12l6-4 6 4"/></svg>
    Relaciones
  </button>
  <span class="toolbar-divider"></span>
  <button onclick="resetView()">Reset</button>
  <select id="filterEntity" onchange="filterByEntity(this.value)">
    <option value="">Filtrar entidad...</option>
  </select>
</div>
<div id="cy"></div>
<div id="tooltip"></div>
<div id="panel">
  <div id="panel-header">
    <span class="logo">Seguros Bolivar</span>
    <button class="close-btn" onclick="resetHighlight();hidePanel();">&times;</button>
  </div>
  <div id="panel-body">
    <h2 id="panel-title"></h2>
    <div id="panel-content"></div>
  </div>
</div>
<div id="legend" class="glass-panel">
  <div class="row"><span class="dot" style="color:#ff9f0a;background:#ff9f0a"></span> HU analyzed</div>
  <div class="row"><span class="dot" style="color:#0a84ff;background:#0a84ff"></span> HU refined</div>
  <div class="row"><span class="dot" style="color:#30d158;background:#30d158"></span> HU completed</div>
  <div class="row"><span class="dot-diamond" style="background:#64d2ff"></span> Entidad</div>
  <div class="row"><span class="dot" style="background:#bf5af2;color:#bf5af2"></span> Flujo</div>
  <div class="row"><span class="line" style="background:#ff453a"></span> depends_on</div>
  <div class="row"><span class="line" style="background:#30d158"></span> impacts</div>
</div>
<script>
let cy, allData = {nodes:[],edges:[]}, showEntities = true, showFlows = false, showRelations = true, currentLayout = 'dagre';
const tooltip = document.getElementById('tooltip');

async function init() {
  const res = await fetch('/api/graph');
  allData = await res.json();
  const sel = document.getElementById('filterEntity');
  allData.nodes.filter(n => n.data.type==='entity').forEach(e => {
    const o = document.createElement('option'); o.value = e.data.id; o.textContent = e.data.label; sel.appendChild(o);
  });

  // Global mouse tracker for tooltip position (works even outside cy nodes)
  document.addEventListener('mousemove', function(e) {
    tooltip.style.left = (e.clientX + 16) + 'px';
    tooltip.style.top = (e.clientY + 14) + 'px';
  });

  // Safety: hide tooltip when mouse leaves the graph area
  document.getElementById('cy').addEventListener('mouseleave', function() {
    tooltip.classList.remove('visible');
  });

  renderGraph();
}

function getAllElements() {
  var nodes = allData.nodes || [];
  var nodeIds = new Set(nodes.map(function(n) { return n.data.id; }));
  var edges = (allData.edges || []).filter(function(e) {
    // Only include edges whose both endpoints exist as nodes
    return nodeIds.has(e.data.source) && nodeIds.has(e.data.target);
  });
  return nodes.concat(edges);
}

function getFiltered() {
  const nodes = allData.nodes.filter(n => {
    if (n.data.type==='entity' && !showEntities) return false;
    if (n.data.type==='flow' && !showFlows) return false;
    return true;
  });
  const nodeIds = new Set(nodes.map(n => n.data.id));
  const edges = allData.edges.filter(e => {
    if (e.data.relation==='has_entity' && !showEntities) return false;
    if (e.data.relation==='in_flow' && !showFlows) return false;
    if ((e.data.relation==='depends_on' || e.data.relation==='impacts') && !showRelations) return false;
    // Only include edges whose both endpoints exist as visible nodes
    if (!nodeIds.has(e.data.source) || !nodeIds.has(e.data.target)) return false;
    return true;
  });
  return [...nodes, ...edges];
}

function layoutCfg(name) {
  if (name==='dagre') return {
    name:'dagre', rankDir:'TB', nodeSep:100, edgeSep:50, rankSep:150,
    animate:true, animationDuration:1000, animationEasing:'ease-in-out-cubic',
    fit:true, padding:80
  };
  return {
    name:'concentric',
    concentric: n => n.data('type')==='story'?3:n.data('type')==='flow'?2:1,
    levelWidth: ()=>1, minNodeSpacing:100,
    animate:true, animationDuration:1000, fit:true, padding:80
  };
}

function renderGraph() {
  var container = document.getElementById('cy');

  // Fade out, rebuild, fade in
  container.style.transition = 'opacity 0.25s ease';
  container.style.opacity = '0';

  setTimeout(function(){
    if (cy) cy.destroy();

    // Remove transition during build to avoid interference
    container.style.transition = 'none';

    cy = cytoscape({
      container: container,
      elements: getAllElements(),
      style: [
      // Story nodes — neural network synapses
      { selector: 'node[type="story"]', style: {
        'label':'data(label)',
        'text-valign':'bottom','text-halign':'center','text-margin-y':12,
        'font-size':'12px','font-weight':'500','letter-spacing':'-0.2px',
        'color':'rgba(255,255,255,0.85)',
        'text-outline-color':'rgba(0,0,0,0.8)','text-outline-width':2,
        'background-color': function(e){
          var s=e.data('status');
          return s==='completed'?'#30d158':s==='refined'?'#0a84ff':'#ff9f0a';
        },
        'background-opacity':0.85,
        'width':50,'height':50,
        'border-width':2,'border-opacity':0.5,
        'border-color': function(e){
          var s=e.data('status');
          return s==='completed'?'#30d158':s==='refined'?'#0a84ff':'#ff9f0a';
        },
        'shadow-blur':24,'shadow-opacity':0.6,
        'shadow-color': function(e){
          var s=e.data('status');
          return s==='completed'?'#30d158':s==='refined'?'#0a84ff':'#ff9f0a';
        },
        'overlay-opacity':0, 'overlay-padding':6,
        'transition-property':'shadow-blur,shadow-opacity,width,height,border-width',
        'transition-duration':'0.3s','transition-timing-function':'ease-out',
      }},
      // Entity nodes — small synaptic terminals
      { selector: 'node[type="entity"]', style: {
        'label':'data(label)',
        'font-size':'9px','color':'rgba(100,210,255,0.8)',
        'text-outline-color':'rgba(0,0,0,0.6)','text-outline-width':1,
        'text-valign':'bottom','text-margin-y':5,
        'background-color':'rgba(100,210,255,0.2)',
        'border-width':1,'border-color':'rgba(100,210,255,0.4)',
        'width':12,'height':12,'shape':'diamond',
        'shadow-blur':8,'shadow-opacity':0.4,'shadow-color':'#64d2ff',
        'overlay-opacity':0, 'overlay-padding':4,
      }},
      // Flow nodes
      { selector: 'node[type="flow"]', style: {
        'label':'data(label)',
        'font-size':'9px','color':'rgba(191,90,242,0.8)',
        'text-outline-color':'rgba(0,0,0,0.6)','text-outline-width':1,
        'text-valign':'bottom','text-margin-y':5,
        'background-color':'rgba(191,90,242,0.2)',
        'border-width':1,'border-color':'rgba(191,90,242,0.4)',
        'width':14,'height':14,'shape':'round-rectangle',
        'shadow-blur':8,'shadow-opacity':0.3,'shadow-color':'#bf5af2',
        'overlay-opacity':0, 'overlay-padding':4,
      }},
      // Edges — neural pathways
      { selector: 'edge[relation="depends_on"]', style: {
        'line-color':'rgba(255,69,58,0.6)',
        'target-arrow-color':'#ff453a','target-arrow-shape':'triangle','arrow-scale':1,
        'curve-style':'unbundled-bezier',
        'control-point-distances':[40],'control-point-weights':[0.5],
        'width':2,'opacity':0.75,
        'line-gradient-stop-colors':['rgba(255,69,58,0.8)','rgba(255,69,58,0.3)'],
      }},
      { selector: 'edge[relation="impacts"]', style: {
        'line-color':'rgba(48,209,88,0.6)',
        'target-arrow-color':'#30d158','target-arrow-shape':'triangle','arrow-scale':1,
        'curve-style':'unbundled-bezier',
        'control-point-distances':[-40],'control-point-weights':[0.5],
        'width':2,'opacity':0.75,
      }},
      { selector: 'edge[relation="has_entity"]', style: {
        'line-color':'rgba(100,210,255,0.15)',
        'curve-style':'bezier','width':0.7,'opacity':0.5,'line-style':'dotted',
      }},
      { selector: 'edge[relation="in_flow"]', style: {
        'line-color':'rgba(191,90,242,0.15)',
        'curve-style':'bezier','width':0.7,'opacity':0.5,'line-style':'dotted',
      }},
      { selector: 'edge[relation="related_to"]', style: {
        'line-color':'rgba(255,255,255,0.08)',
        'curve-style':'bezier','width':1,'line-style':'dashed','opacity':0.3,
      }},
      // States
      { selector: '.highlighted', style: {
        'border-width':3,'border-color':'#fff','border-opacity':1,
        'shadow-blur':40,'shadow-opacity':0.9,'opacity':1,'z-index':999,
      }},
      { selector: '.faded', style: { 'opacity':0.06 }},
    ],
    layout: layoutCfg(currentLayout),
    minZoom:0.3, maxZoom:3, wheelSensitivity:0.2,
  });

  // Fade in new graph
  setTimeout(function(){
    container.style.transition = 'opacity 0.4s ease';
    container.style.opacity = '1';
  }, 80);

  // Neural pulse effect
  startNeuralPulse();

  // --- TOOLTIP ---
  cy.on('mouseover', 'node', function(evt){
    clearTimeout(window._ttHide);
    var d = evt.target.data();
    var html = '';
    if (d.type === 'story') {
      html = '<div class="tt-id">' + d.id + '</div><div class="tt-title">' + d.title + '</div><div class="tt-desc">Historia de usuario con ' + (d.entities||[]).length + ' entidades y ' + (d.flows||[]).length + ' flujos.</div><div class="tt-meta"><span>' + d.gaps + ' gaps</span><span>' + d.questions + ' preguntas</span></div>';
    } else if (d.type === 'entity') {
      html = '<div class="tt-id">Entidad</div><div class="tt-title">' + d.label + '</div><div class="tt-desc">Aparece en ' + (d.appears_in||[]).length + ' HU(s): ' + (d.appears_in||[]).join(', ') + '</div>';
    } else if (d.type === 'flow') {
      html = '<div class="tt-id">Flujo \u00b7 ' + (d.status||'') + '</div><div class="tt-title">' + d.label + '</div><div class="tt-desc">Involucra ' + (d.stories||[]).length + ' HU(s): ' + (d.stories||[]).join(', ') + '</div>';
    }
    if (html) {
      tooltip.innerHTML = html;
      tooltip.classList.add('visible');
    }
  });

  cy.on('mouseout', 'node', function(){
    window._ttHide = setTimeout(function(){ tooltip.classList.remove('visible'); }, 120);
  });

  // Click story for detail panel
  cy.on('tap', 'node[type="story"]', async function(evt){
    tooltip.classList.remove('visible');
    highlightNode(evt.target);
    await showDetail(evt.target.data('id'));
  });
  cy.on('tap', function(evt){ if(evt.target===cy){resetHighlight();hidePanel();} });

  // Apply current layer visibility state
  applyLayerVisibility();

  }, 300); // end setTimeout fade-out
}

// Neural pulse — periodic glow animation on edges to simulate signal transmission
var _neuralPulseIntervals = [];
function startNeuralPulse() {
  // Clear any previous intervals
  _neuralPulseIntervals.forEach(function(id) { clearInterval(id); });
  _neuralPulseIntervals = [];

  _neuralPulseIntervals.push(setInterval(function(){
    if (!cy) return;
    var edges = cy.edges('[relation="depends_on"],[relation="impacts"]').not('.faded').not(':hidden');
    if (!edges.length) return;
    var randEdge = edges[Math.floor(Math.random()*edges.length)];
    randEdge.animate(
      {style:{'width':4,'opacity':1}},
      {duration:400, complete:function(){
        randEdge.animate({style:{'width':2,'opacity':0.75}},{duration:600});
      }}
    );
  }, 1500));

  // Subtle node breathing
  _neuralPulseIntervals.push(setInterval(function(){
    if (!cy) return;
    var stories = cy.nodes('[type="story"]').not('.faded').not(':hidden');
    if (!stories.length) return;
    var randNode = stories[Math.floor(Math.random()*stories.length)];
    randNode.animate(
      {style:{'shadow-blur':36,'shadow-opacity':0.8}},
      {duration:600, complete:function(){
        randNode.animate({style:{'shadow-blur':24,'shadow-opacity':0.6}},{duration:800});
      }}
    );
  }, 2000));
}

function highlightNode(node) {
  // Stop any ongoing neural pulse animations to prevent style conflicts
  cy.elements().stop(true, true);
  cy.elements().addClass('faded');
  node.removeClass('faded').addClass('highlighted');
  node.neighborhood().removeClass('faded');
}
function resetHighlight() {
  cy.elements().stop(true, true);
  cy.elements().removeClass('faded highlighted');
}
function hidePanel() {
  var p = document.getElementById('panel');
  p.style.transform = 'translateX(100%)'; p.style.opacity = '0';
  setTimeout(function(){ p.classList.remove('active'); p.style.display = 'none'; }, 500);
}

async function showDetail(id) {
  var res = await fetch('/api/story/'+id);
  var s = await res.json();
  if (s.error) return;

  var panel = document.getElementById('panel');
  document.getElementById('panel-title').textContent = s.id+' \u2014 '+s.title;

  var h = '';

  // Status + stats row
  h += '<div class="panel-section"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">';
  h += '<span class="status-badge status-'+s.status+'">'+s.status+'</span>';
  h += '<div class="stats-row">';
  h += '<span class="stat-pill"><span class="stat-num">'+s.total_gaps+'</span> gaps</span>';
  h += '<span class="stat-pill"><span class="stat-num">'+s.total_questions+'</span> preguntas</span>';
  h += '</div></div></div>';

  // Narrative
  h += '<div class="panel-section"><h3>Narrativa</h3>';
  h += '<div class="narrative-block">';
  h += '<strong>Como</strong>' + s.narrative.as_a;
  h += '<strong>Quiero</strong>' + s.narrative.i_want;
  h += '<strong>Para</strong>' + s.narrative.so_that;
  h += '</div></div>';

  // Acceptance criteria
  if (s.acceptance_criteria && s.acceptance_criteria.length) {
    h += '<div class="panel-section"><h3>Criterios de Aceptaci\u00f3n</h3>';
    h += '<ul class="acceptance-criteria">';
    s.acceptance_criteria.forEach(function(ac, i) {
      h += '<li>';
      if (ac.given) h += '<span class="ac-label ac-given">Given</span><span style="color:var(--text-secondary)">' + ac.given + '</span><br>';
      if (ac.when) h += '<span class="ac-label ac-when">When</span><span style="color:var(--text-secondary)">' + ac.when + '</span><br>';
      if (ac.then) h += '<span class="ac-label ac-then">Then</span><span style="color:var(--text-secondary)">' + ac.then + '</span>';
      h += '</li>';
    });
    h += '</ul></div>';
  }

  // Entities
  if (s.entities_detected && s.entities_detected.length) {
    h += '<div class="panel-section"><h3>Entidades</h3><div>';
    s.entities_detected.forEach(function(e){h+='<span class="tag tag-entity">'+e+'</span>';});
    h += '</div></div>';
  }

  // Flows
  if (s.flows_detected && s.flows_detected.length) {
    h += '<div class="panel-section"><h3>Flujos</h3><div>';
    s.flows_detected.forEach(function(f){h+='<span class="tag tag-flow">'+f+'</span>';});
    h += '</div></div>';
  }

  // Complexity
  if (s.complexity_tags && s.complexity_tags.length) {
    h += '<div class="panel-section"><h3>Complejidad</h3><div>';
    s.complexity_tags.forEach(function(t){h+='<span class="tag tag-complexity">'+t+'</span>';});
    h += '</div></div>';
  }

  // Dependencies
  if (s.dependencies && s.dependencies.length) {
    h += '<div class="panel-section"><h3>Dependencias</h3><ul>';
    s.dependencies.forEach(function(d){h+='<li>'+d+'</li>';});
    h += '</ul></div>';
  }

  // Expert analysis
  if (s.expert_analysis && s.expert_analysis.length) {
    h += '<div class="panel-section"><h3>Panel de Expertos</h3><ul>';
    s.expert_analysis.forEach(function(e){
      h+='<li><span class="tag tag-expert">'+e.expert+'</span> '+e.gaps.length+' gaps &middot; '+e.questions.length+' preguntas</li>';
    });
    h += '</ul></div>';
  }

  var content = document.getElementById('panel-content');
  content.classList.add('transitioning');
  setTimeout(function(){
    content.innerHTML = h;
    content.classList.remove('transitioning');
  }, 250);

  // Show panel: set display first, then animate in on next frame for transition to work
  panel.style.display = 'flex';
  panel.classList.add('active');
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      panel.style.transform='translateX(0)'; panel.style.opacity='1';
    });
  });
}

function setLayout(name) {
  currentLayout = name;
  // Toggle group: only layout buttons inside .toggle-group
  document.querySelectorAll('.toggle-group button').forEach(b=>b.classList.remove('active'));
  var btn=document.getElementById('btn-'+name); if(btn)btn.classList.add('active');
  // Fade transition for layout change
  var container = document.getElementById('cy');
  container.style.transition = 'opacity 0.25s ease';
  container.style.opacity = '0.3';
  setTimeout(function(){
    cy.layout(layoutCfg(name)).run();
    setTimeout(function(){ container.style.opacity = '1'; }, 200);
  }, 250);
}
function toggleEntities() {
  showEntities=!showEntities;
  document.getElementById('btn-entities').classList.toggle('active',showEntities);
  applyLayerVisibility();
}
function toggleFlows() {
  showFlows=!showFlows;
  document.getElementById('btn-flows').classList.toggle('active',showFlows);
  applyLayerVisibility();
}
function toggleRelations() {
  showRelations=!showRelations;
  document.getElementById('btn-relations').classList.toggle('active',showRelations);
  applyLayerVisibility();
}

function applyLayerVisibility() {
  if (!cy) return;

  // Entity nodes and their edges
  if (showEntities) {
    cy.nodes('[type="entity"]').show();
    cy.edges('[relation="has_entity"]').show();
  } else {
    cy.nodes('[type="entity"]').hide();
    cy.edges('[relation="has_entity"]').hide();
  }

  // Flow nodes and their edges
  if (showFlows) {
    cy.nodes('[type="flow"]').show();
    cy.edges('[relation="in_flow"]').show();
  } else {
    cy.nodes('[type="flow"]').hide();
    cy.edges('[relation="in_flow"]').hide();
  }

  // Relation edges (depends_on, impacts)
  if (showRelations) {
    cy.edges('[relation="depends_on"]').show();
    cy.edges('[relation="impacts"]').show();
  } else {
    cy.edges('[relation="depends_on"]').hide();
    cy.edges('[relation="impacts"]').hide();
  }
}
function filterByEntity(id) {
  if(!id){resetHighlight();return;}
  var n=cy.getElementById(id); if(n.length)highlightNode(n);
}
function resetView() { resetHighlight(); hidePanel(); cy.fit(undefined,80); }

// ─── WORKSPACE & ECOSYSTEM SELECTORS ─────────────────────────────────────────

async function loadSelectors() {
  // Load workspaces
  try {
    var wsRes = await fetch('/api/workspaces');
    var wsData = await wsRes.json();
    var wsSel = document.getElementById('selectorWorkspace');
    wsSel.innerHTML = '<option value="">Sin workspace</option>';
    (wsData.workspaces || []).forEach(function(w) {
      var opt = document.createElement('option');
      opt.value = w.workspace_id;
      opt.textContent = w.project_name || w.workspace_id;
      if (w.story_count > 0) opt.textContent += ' (' + w.story_count + ' HUs)';
      if (w.workspace_id === wsData.active) opt.selected = true;
      wsSel.appendChild(opt);
    });
    wsSel.classList.toggle('selector-active', !!wsData.active);
  } catch(e) {
    console.warn('Error cargando workspaces:', e);
  }

  // Load ecosystems
  try {
    var ecoRes = await fetch('/api/ecosystems');
    var ecoData = await ecoRes.json();
    var ecoSel = document.getElementById('selectorEcosystem');
    ecoSel.innerHTML = '<option value="">Sin ecosistema</option>';
    (ecoData.ecosystems || []).forEach(function(eco) {
      var opt = document.createElement('option');
      opt.value = eco.ecosystem_id;
      opt.textContent = eco.name || eco.ecosystem_id;
      if (eco.apps_count > 0) opt.textContent += ' (' + eco.apps_count + ' apps)';
      if (eco.ecosystem_id === ecoData.active) opt.selected = true;
      ecoSel.appendChild(opt);
    });
    ecoSel.classList.toggle('selector-active', !!ecoData.active);
  } catch(e) {
    console.warn('Error cargando ecosistemas:', e);
  }
}

async function switchWorkspace(workspaceId) {
  if (!workspaceId) return;
  var sel = document.getElementById('selectorWorkspace');
  sel.disabled = true;
  try {
    var res = await fetch('/api/workspaces/switch', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({workspace_id: workspaceId})
    });
    var data = await res.json();
    if (data.error) {
      console.error('Error switching workspace:', data.error);
      await loadSelectors();
      return;
    }
    sel.classList.add('selector-active');
    // Reload graph with new workspace data
    await reloadGraph();
  } catch(e) {
    console.error('Error switching workspace:', e);
  } finally {
    sel.disabled = false;
  }
}

async function switchEcosystem(ecosystemId) {
  if (!ecosystemId) return;
  var sel = document.getElementById('selectorEcosystem');
  sel.disabled = true;
  try {
    var res = await fetch('/api/ecosystems/switch', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ecosystem_id: ecosystemId})
    });
    var data = await res.json();
    if (data.error) {
      console.error('Error switching ecosystem:', data.error);
      await loadSelectors();
      return;
    }
    sel.classList.add('selector-active');
    // Reload graph with new ecosystem context
    await reloadGraph();
  } catch(e) {
    console.error('Error switching ecosystem:', e);
  } finally {
    sel.disabled = false;
  }
}

async function reloadGraph() {
  var res = await fetch('/api/graph');
  allData = await res.json();
  // Rebuild entity filter
  var sel = document.getElementById('filterEntity');
  sel.innerHTML = '<option value="">Filtrar entidad...</option>';
  allData.nodes.filter(function(n){ return n.data.type==='entity'; }).forEach(function(e) {
    var o = document.createElement('option'); o.value = e.data.id; o.textContent = e.data.label; sel.appendChild(o);
  });
  renderGraph();
}

init();
loadSelectors();
