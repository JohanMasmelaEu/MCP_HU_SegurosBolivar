<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HU Graph Viewer - MCP_HU_SegurosBolivar</title>
<script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  display: flex; height: 100vh;
  background: #0d1117; color: #e6edf3;
  overflow: hidden;
}
#cy { flex: 1; }
#panel {
  width: 360px; background: #161b22;
  border-left: 1px solid #30363d;
  overflow-y: auto; padding: 20px;
  display: none; flex-direction: column; gap: 12px;
}
#panel.active { display: flex; }
#panel h2 { color: #58a6ff; font-size: 15px; font-weight: 600; }
#panel h3 { color: #8b949e; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 8px; }
#panel p { font-size: 13px; line-height: 1.6; color: #c9d1d9; }
#panel ul { padding-left: 16px; font-size: 12px; color: #c9d1d9; }
#panel li { margin: 3px 0; }
.tag {
  display: inline-block; padding: 3px 8px; border-radius: 12px;
  font-size: 10px; font-weight: 500; margin: 2px 3px 2px 0;
}
.tag-entity { background: #1f3a5f; color: #58a6ff; border: 1px solid #264d7a; }
.tag-flow { background: #2d1f3a; color: #d2a8ff; border: 1px solid #4a2d6a; }
.tag-complexity { background: #3a2f1f; color: #f0c674; border: 1px solid #5a4520; }
.tag-expert { background: #1f3a2d; color: #7ee787; border: 1px solid #2a5a3d; }
.status-badge {
  display: inline-block; padding: 3px 10px; border-radius: 12px;
  font-size: 10px; font-weight: 600; text-transform: uppercase;
}
.status-analyzed { background: #3a2f1f; color: #f0c674; }
.status-refined { background: #1f3a5f; color: #58a6ff; }
.status-completed { background: #1f3a2d; color: #7ee787; }
#toolbar {
  position: absolute; top: 16px; left: 16px; z-index: 10;
  display: flex; gap: 8px; align-items: center;
}
#toolbar button {
  background: #21262d; border: 1px solid #30363d; color: #c9d1d9;
  padding: 7px 14px; border-radius: 6px; cursor: pointer;
  font-size: 12px; font-weight: 500; transition: all 0.15s;
}
#toolbar button:hover { background: #30363d; border-color: #58a6ff; color: #58a6ff; }
#toolbar button.active { background: #1f3a5f; border-color: #58a6ff; color: #58a6ff; }
#toolbar select {
  background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
  padding: 7px 10px; border-radius: 6px; font-size: 12px;
}
#legend {
  position: absolute; bottom: 16px; left: 16px;
  background: rgba(22,27,34,0.95); border: 1px solid #30363d;
  padding: 14px 18px; border-radius: 8px; font-size: 11px;
}
#legend .row { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
#legend .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
#legend .dot-diamond { width: 10px; height: 10px; transform: rotate(45deg); flex-shrink: 0; }
#legend .line { width: 20px; height: 2px; flex-shrink: 0; border-radius: 1px; }
#header {
  position: absolute; top: 16px; right: 16px; z-index: 10;
  display: flex; align-items: center; gap: 10px;
}
#header .logo { font-size: 13px; font-weight: 600; color: #8b949e; }
</style>
</head>
<body>
<div id="toolbar">
  <button onclick="setLayout('dagre')" id="btn-dagre" class="active">Jerarquico</button>
  <button onclick="setLayout('concentric')" id="btn-concentric">Concentrico</button>
  <button onclick="toggleEntities()" id="btn-entities">Entidades</button>
  <button onclick="toggleFlows()" id="btn-flows">Flujos</button>
  <button onclick="resetView()">Reset</button>
  <select id="filterEntity" onchange="filterByEntity(this.value)">
    <option value="">Filtrar por entidad...</option>
  </select>
</div>
<div id="header">
  <span class="logo">Seguros Bolivar</span>
</div>
<div id="cy"></div>
<div id="panel">
  <h2 id="panel-title"></h2>
  <div id="panel-content"></div>
</div>
<div id="legend">
  <div class="row"><span class="dot" style="background:#f78166"></span> HU (analyzed)</div>
  <div class="row"><span class="dot" style="background:#58a6ff"></span> HU (refined)</div>
  <div class="row"><span class="dot" style="background:#7ee787"></span> HU (completed)</div>
  <div class="row"><span class="dot-diamond" style="background:#58a6ff"></span> Entidad</div>
  <div class="row"><span class="dot" style="background:#d2a8ff"></span> Flujo</div>
  <div class="row"><span class="line" style="background:#f78166"></span> depends_on</div>
  <div class="row"><span class="line" style="background:#7ee787"></span> impacts</div>
  <div class="row"><span class="line" style="background:#30363d"></span> has_entity / in_flow</div>
</div>
<script>
let cy;
let allData = { nodes: [], edges: [] };
let showEntities = true;
let showFlows = false;
let currentLayout = 'dagre';

async function init() {
  const res = await fetch('/api/graph');
  allData = await res.json();

  const entitySelect = document.getElementById('filterEntity');
  allData.nodes.filter(n => n.data.type === 'entity').forEach(e => {
    const opt = document.createElement('option');
    opt.value = e.data.id;
    opt.textContent = e.data.label;
    entitySelect.appendChild(opt);
  });

  renderGraph();
}

function getFilteredElements() {
  let nodes = allData.nodes.filter(n => {
    if (n.data.type === 'entity' && !showEntities) return false;
    if (n.data.type === 'flow' && !showFlows) return false;
    return true;
  });
  let edges = allData.edges.filter(e => {
    if (e.data.relation === 'has_entity' && !showEntities) return false;
    if (e.data.relation === 'in_flow' && !showFlows) return false;
    return true;
  });
  return [...nodes, ...edges];
}

function getLayoutConfig(name) {
  if (name === 'dagre') {
    return {
      name: 'dagre',
      rankDir: 'TB',
      nodeSep: 80,
      edgeSep: 40,
      rankSep: 120,
      animate: true,
      animationDuration: 500,
      fit: true,
      padding: 60,
    };
  }
  if (name === 'concentric') {
    return {
      name: 'concentric',
      concentric: function(node) {
        if (node.data('type') === 'story') return 3;
        if (node.data('type') === 'flow') return 2;
        return 1;
      },
      levelWidth: function() { return 1; },
      minNodeSpacing: 80,
      animate: true,
      animationDuration: 500,
      fit: true,
      padding: 60,
    };
  }
  return { name: 'dagre', rankDir: 'TB', nodeSep: 80, rankSep: 120, padding: 60 };
}

function renderGraph() {
  const elements = getFilteredElements();

  if (cy) { cy.destroy(); }

  cy = cytoscape({
    container: document.getElementById('cy'),
    elements: elements,
    style: [
      {
        selector: 'node[type="story"]',
        style: {
          'label': 'data(label)',
          'text-valign': 'bottom',
          'text-halign': 'center',
          'text-margin-y': 8,
          'font-size': '11px',
          'font-weight': '600',
          'color': '#e6edf3',
          'text-outline-color': '#0d1117',
          'text-outline-width': 2,
          'background-color': function(ele) {
            var s = ele.data('status');
            if (s === 'completed') return '#7ee787';
            if (s === 'refined') return '#58a6ff';
            return '#f78166';
          },
          'width': 44,
          'height': 44,
          'border-width': 3,
          'border-color': function(ele) {
            var s = ele.data('status');
            if (s === 'completed') return '#2ea043';
            if (s === 'refined') return '#1f6feb';
            return '#da3633';
          },
          'shadow-blur': 12,
          'shadow-color': function(ele) {
            var s = ele.data('status');
            if (s === 'completed') return '#7ee787';
            if (s === 'refined') return '#58a6ff';
            return '#f78166';
          },
          'shadow-opacity': 0.4,
        }
      },
      {
        selector: 'node[type="entity"]',
        style: {
          'label': 'data(label)',
          'font-size': '9px',
          'color': '#58a6ff',
          'text-outline-color': '#0d1117',
          'text-outline-width': 1,
          'text-valign': 'bottom',
          'text-margin-y': 6,
          'background-color': '#1f3a5f',
          'border-width': 1.5,
          'border-color': '#58a6ff',
          'width': 16,
          'height': 16,
          'shape': 'diamond',
        }
      },
      {
        selector: 'node[type="flow"]',
        style: {
          'label': 'data(label)',
          'font-size': '9px',
          'color': '#d2a8ff',
          'text-outline-color': '#0d1117',
          'text-outline-width': 1,
          'text-valign': 'bottom',
          'text-margin-y': 6,
          'background-color': '#2d1f3a',
          'border-width': 1.5,
          'border-color': '#d2a8ff',
          'width': 18,
          'height': 18,
          'shape': 'round-rectangle',
        }
      },
      {
        selector: 'edge[relation="depends_on"]',
        style: {
          'line-color': '#f78166',
          'target-arrow-color': '#f78166',
          'target-arrow-shape': 'triangle',
          'arrow-scale': 1.2,
          'curve-style': 'unbundled-bezier',
          'control-point-distances': [40],
          'control-point-weights': [0.5],
          'width': 2.5,
          'opacity': 0.85,
        }
      },
      {
        selector: 'edge[relation="impacts"]',
        style: {
          'line-color': '#7ee787',
          'target-arrow-color': '#7ee787',
          'target-arrow-shape': 'triangle',
          'arrow-scale': 1.2,
          'curve-style': 'unbundled-bezier',
          'control-point-distances': [-40],
          'control-point-weights': [0.5],
          'width': 2.5,
          'opacity': 0.85,
        }
      },
      {
        selector: 'edge[relation="related_to"]',
        style: {
          'line-color': '#484f58',
          'curve-style': 'bezier',
          'width': 1.5,
          'line-style': 'dashed',
          'opacity': 0.5,
        }
      },
      {
        selector: 'edge[relation="has_entity"]',
        style: {
          'line-color': '#264d7a',
          'curve-style': 'bezier',
          'width': 1,
          'opacity': 0.4,
          'line-style': 'dotted',
        }
      },
      {
        selector: 'edge[relation="in_flow"]',
        style: {
          'line-color': '#4a2d6a',
          'curve-style': 'bezier',
          'width': 1,
          'opacity': 0.4,
          'line-style': 'dotted',
        }
      },
      {
        selector: ':selected',
        style: { 'border-width': 4, 'border-color': '#ffffff' }
      },
      {
        selector: '.highlighted',
        style: { 'border-width': 4, 'border-color': '#ffffff', 'opacity': 1, 'z-index': 999 }
      },
      {
        selector: '.faded',
        style: { 'opacity': 0.12 }
      }
    ],
    layout: getLayoutConfig(currentLayout),
    minZoom: 0.3,
    maxZoom: 3,
    wheelSensitivity: 0.3,
  });

  cy.on('tap', 'node[type="story"]', async function(evt) {
    highlightNode(evt.target);
    await showStoryDetail(evt.target.data('id'));
  });

  cy.on('tap', function(evt) {
    if (evt.target === cy) { resetHighlight(); hidePanel(); }
  });
}

function highlightNode(node) {
  cy.elements().addClass('faded');
  node.removeClass('faded').addClass('highlighted');
  node.neighborhood().removeClass('faded');
}

function resetHighlight() {
  cy.elements().removeClass('faded').removeClass('highlighted');
}

function hidePanel() {
  document.getElementById('panel').classList.remove('active');
}

async function showStoryDetail(id) {
  const res = await fetch('/api/story/' + id);
  const story = await res.json();
  if (story.error) return;

  const panel = document.getElementById('panel');
  const title = document.getElementById('panel-title');
  const content = document.getElementById('panel-content');

  title.textContent = story.id + ' \u2014 ' + story.title;

  let html = '<span class="status-badge status-' + story.status + '">' + story.status + '</span>';
  html += '<h3>Narrativa</h3>';
  html += '<p><strong>Como</strong> ' + story.narrative.as_a + '<br>';
  html += '<strong>Quiero</strong> ' + story.narrative.i_want + '<br>';
  html += '<strong>Para</strong> ' + story.narrative.so_that + '</p>';

  html += '<h3>Entidades</h3><div>';
  story.entities_detected.forEach(function(e) { html += '<span class="tag tag-entity">' + e + '</span>'; });
  html += '</div>';

  html += '<h3>Flujos</h3><div>';
  story.flows_detected.forEach(function(f) { html += '<span class="tag tag-flow">' + f + '</span>'; });
  html += '</div>';

  if (story.complexity_tags && story.complexity_tags.length) {
    html += '<h3>Complejidad</h3><div>';
    story.complexity_tags.forEach(function(t) { html += '<span class="tag tag-complexity">' + t + '</span>'; });
    html += '</div>';
  }

  if (story.dependencies && story.dependencies.length) {
    html += '<h3>Dependencias</h3><ul>';
    story.dependencies.forEach(function(d) { html += '<li>' + d + '</li>'; });
    html += '</ul>';
  }

  if (story.expert_analysis && story.expert_analysis.length) {
    html += '<h3>Expertos</h3><ul>';
    story.expert_analysis.forEach(function(e) {
      html += '<li><span class="tag tag-expert">' + e.expert + '</span> ';
      html += e.gaps.length + ' gaps, ' + e.questions.length + ' preguntas</li>';
    });
    html += '</ul>';
  }

  html += '<h3 style="margin-top:12px">Gaps: ' + story.total_gaps + ' | Preguntas: ' + story.total_questions + '</h3>';

  content.innerHTML = html;
  panel.classList.add('active');
}

function setLayout(name) {
  currentLayout = name;
  document.querySelectorAll('#toolbar button').forEach(function(b) { b.classList.remove('active'); });
  var btn = document.getElementById('btn-' + name);
  if (btn) btn.classList.add('active');
  cy.layout(getLayoutConfig(name)).run();
}

function toggleEntities() {
  showEntities = !showEntities;
  var btn = document.getElementById('btn-entities');
  btn.classList.toggle('active', showEntities);
  renderGraph();
}

function toggleFlows() {
  showFlows = !showFlows;
  var btn = document.getElementById('btn-flows');
  btn.classList.toggle('active', showFlows);
  renderGraph();
}

function filterByEntity(entityId) {
  if (!entityId) { resetHighlight(); return; }
  var node = cy.getElementById(entityId);
  if (node.length) { highlightNode(node); }
}

function resetView() {
  resetHighlight();
  hidePanel();
  cy.fit(undefined, 60);
}

init();
</script>
</body>
</html>
