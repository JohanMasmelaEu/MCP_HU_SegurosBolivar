* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, sans-serif; background: #0a0a0a; color: #fff; height: 100vh; overflow: hidden; }
.container { width: 100%; height: 100%; position: relative; }
svg { width: 100%; height: 100%; }
.conventions {
  position: absolute; bottom: 16px; left: 16px;
  background: rgba(20,20,22,0.9); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px; padding: 10px 14px; font-size: 10px;
  backdrop-filter: blur(20px); max-width: 340px; z-index: 10;
}
.conventions summary { cursor: pointer; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: rgba(255,255,255,0.4); list-style: none; display: flex; align-items: center; gap: 6px; }
.conventions summary::before { content: '▼'; font-size: 7px; }
.conventions:not([open]) summary::before { content: '▶'; }
.conventions table { margin-top: 8px; border-collapse: collapse; width: 100%; }
.conventions th { font-size: 8px; text-transform: uppercase; letter-spacing: 0.5px; color: rgba(255,255,255,0.3); text-align: left; padding: 2px 5px; border-bottom: 1px solid rgba(255,255,255,0.06); }
.conventions td { padding: 3px 5px; color: rgba(255,255,255,0.55); font-size: 9px; vertical-align: middle; }
.conventions td:first-child { width: 18px; text-align: center; }
.conventions .sh td { color: #0a84ff; font-weight: 700; font-size: 8px; text-transform: uppercase; padding-top: 7px; border: none; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.dia { width: 6px; height: 6px; transform: rotate(45deg); display: inline-block; border-radius: 1px; }
.ln { width: 16px; height: 0; display: inline-block; }
.light { background: #f2f2f7; }
.light .conventions { background: rgba(255,255,255,0.9); border-color: rgba(0,0,0,0.08); }
.light .conventions summary { color: rgba(0,0,0,0.4); }
.light .conventions th { color: rgba(0,0,0,0.3); border-bottom-color: rgba(0,0,0,0.06); }
.light .conventions td { color: rgba(0,0,0,0.55); }
.light .conventions .sh td { color: #007aff; }
.theme-btn { position: absolute; top: 12px; right: 16px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); padding: 5px 10px; border-radius: 6px; font-size: 10px; cursor: pointer; z-index: 10; }
.light .theme-btn { background: rgba(0,0,0,0.04); border-color: rgba(0,0,0,0.1); color: rgba(0,0,0,0.5); }
</style>
</head>
