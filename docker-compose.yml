version: "3.8"
services:
  mcp-hu:
    build: .
    ports:
      - "9751:9751"
    volumes:
      - ./workspace:/workspace
    environment:
      - PYTHONUNBUFFERED=1
      - MCP_WORKSPACE_PATH=/workspace
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "128M"
    restart: unless-stopped
